; Optional: build with PlatformIO instead of idf.py.
;   pio run                 build
;   pio run -t upload       flash (board in DFU/boot mode over USB)
[platformio]
src_dir = main

[env:flipper_wifi_devboard]
platform = espressif32
framework = espidf
board = esp32-s2-saola-1
board_build.flash_size = 4MB
monitor_speed = 115200
