# Flipper Apps Catalog manifest for Wavehound.
#
# Shared fields (name, id, category, version, author, icon, short_description)
# are read from application.fam and deliberately NOT duplicated here. Only the
# catalog-specific fields live below.
#
# File paths (changelog, screenshots) are resolved relative to the sourcecode
# subdir (flipper_app), NOT to this file's own location. This manifest and the
# files it points at live in flipper_app/catalog/, so the paths carry a
# catalog/ prefix.
#
# To submit: copy this file to the catalog repo at
# applications/GPIO/wavehound/manifest.yml and open a PR (see README / the repo).
# commit_sha is the commit on main that contains the submitted code; bump it
# for each new submission (a new version needs a new commit).

sourcecode:
  type: git
  location:
    origin: https://github.com/MatKier/flipperzero-wavehound.git
    commit_sha: 74d275a49aad0ed8c467f0dd7cc90cc81379508a
    subdir: flipper_app

# Unmodified qFlipper screenshots. The first entry is used as the catalog
# preview; reorder the list to change which shot is the preview.
screenshots:
  - catalog/screenshots/main_screen.png
  - catalog/screenshots/networks.png
  - catalog/screenshots/network_detail.png
  - catalog/screenshots/hunting_ap.png
  - catalog/screenshots/device_detail.png
  - catalog/screenshots/hunting_device.png

changelog: "@catalog/changelog.md"

description: |
  WiFi fox hunting for the Flipper Zero WiFi dev board, running stock
  ESP32 Marauder firmware (v1.19.0). Wavehound locates a 2.4 GHz WiFi
  transmitter by its signal strength: pick an access point or device from a
  live scan that fills as they are heard, or type a MAC by hand, then walk
  around while the Flipper clicks faster and the meter fills as the signal
  gets stronger.

  ## Requires a Marauder WiFi dev board

  This app does nothing on its own. It is a UART client for the ESP32 WiFi
  dev board flashed with ESP32 Marauder v1.19.0; it drives Marauder's serial
  CLI (scan / foxhunt / info). Flashing instructions are in the Marauder
  project.

  ## What it does

  - **Hunt access point** - live scan that fills as networks appear, then hunt
    the chosen AP by RSSI.
  - **Hunt devices** - find stations (phones, laptops, IoT) seen with an access
    point, or just the clients of a nearby AP.
  - **Enter MAC** - hunt any MAC directly, auto-hopping or starting on a chosen
    channel.
  - **Device details** - MAC vendor (OUI) lookup, type, channel, signal, and an
    access point's security.
  - **Saved MACs** - keep favorites on the SD card and relaunch them.
  - **Board info** - Marauder firmware and board identity readout.
  - **Settings** - click volume, default sound, saved-hunt channel, meter
    range (near/normal/far), haptic buzz and keep-backlight, saved on the SD card.

  Wavehound is **receive-only**: it reads frame RSSI and never transmits. Only
  locate networks and devices you own or are authorized to locate. Radio and
  privacy rules vary by jurisdiction.
